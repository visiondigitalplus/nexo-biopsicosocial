services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://nexo:nexo@db:5432/nexo
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET}
      CLINICAL_ENCRYPTION_KEY: ${CLINICAL_ENCRYPTION_KEY:?define CLINICAL_ENCRYPTION_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?define ADMIN_TOKEN}
      OPEN_ACCESS: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    command: >
      sh -c "node scripts/wait-for-db.js &&
             node server/db/migrate.js &&
             node server/db/seed.js &&
             node server/index.js"

volumes:
  pgdata:
